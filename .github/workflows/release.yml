name: Linux release and publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUSTFLAGS: -C target-cpu=x86-64

jobs:
  build:
    name: Build Linux x86-64 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        working-directory: rust
        run: cargo test --locked

      - name: Build CLI
        working-directory: rust
        run: cargo build --locked --release --package connectk-cli

      - name: Build GUI
        run: cargo build --locked --release --manifest-path rust/gui/Cargo.toml

      - name: Package binaries and standard book
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="connectk-${version}-x86_64-unknown-linux-gnu"
          stage="dist/${name}"
          mkdir -p "${stage}/bin" "${stage}/books"
          install -m755 rust/target/release/connectk "${stage}/bin/connectk"
          install -m755 rust/gui/target/release/connectk-gui "${stage}/bin/connectk-gui"
          install -m644 rust/core/assets/std7x6-d10.book "${stage}/books/std7x6-d10.book"
          install -m644 books/README.md "${stage}/books/README.md"
          install -m644 README.md LICENSE "${stage}/"
          tar -C dist -czf "$GITHUB_WORKSPACE/dist/${name}.tar.gz" "${name}"
          cd dist
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.checksum }}

  publish-crates:
    name: Publish crates.io packages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          version = tag[1:]
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1", "--no-deps",
              "--manifest-path", "rust/Cargo.toml"
          ]))
          packages = {p["name"]: p["version"] for p in metadata["packages"]}
          for name in ("connectk-core", "connectk-cli"):
              if packages.get(name) != version:
                  raise SystemExit(f"{name} is {packages.get(name)}, release tag is {version}")
          PY

      - name: Test workspace and verify core package
        working-directory: rust
        run: |
          cargo test --locked
          cargo publish --dry-run --locked --package connectk-core

      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          if curl -fsS "https://crates.io/api/v1/crates/connectk-core/${version}" | jq -e --arg version "$version" '.version.num == $version' >/dev/null; then
            echo "connectk-core ${version} is already published; skipping"
          else
            cargo publish --locked --manifest-path rust/core/Cargo.toml
          fi

      - name: Verify and publish CLI crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          for attempt in 1 2 3 4 5 6; do
            if cargo publish --dry-run --locked --manifest-path rust/cli/Cargo.toml; then
              if curl -fsS "https://crates.io/api/v1/crates/connectk-cli/${version}" | jq -e --arg version "$version" '.version.num == $version' >/dev/null; then
                echo "connectk-cli ${version} is already published; skipping"
              else
                cargo publish --locked --manifest-path rust/cli/Cargo.toml
              fi
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "connectk-core is not yet available in the crates.io index, or CLI validation failed." >&2
          exit 1

  publish-aur:
    name: Update the Arch package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure AUR access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Trust the AUR host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update source and binary packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for package in connectk connectk-bin; do
            src="$GITHUB_WORKSPACE/packaging/aur/${package}"
            sed -i -E "s/^pkgver=.*/pkgver=${version}/" "$src/PKGBUILD"
            sed -i -E "s/^pkgver = .*/pkgver = ${version}/" "$src/.SRCINFO"
            sed -i -E "s/#tag=v[0-9.]+/#tag=v${version}/g" "$src/.SRCINFO"
            sed -i -E "s|/download/v[0-9.]+/|/download/v${version}/|g" "$src/.SRCINFO"
            git clone "ssh://aur@aur.archlinux.org/${package}.git" "aur-${package}"
            cp "$src/PKGBUILD" "$src/.SRCINFO" "aur-${package}/"
            cd "aur-${package}"
            git checkout -B master
            git config user.name "CallMeAlphabet"
            git config user.email "sigma.alphabet@proton.me"
            git add PKGBUILD .SRCINFO
            if ! git diff --cached --quiet; then
              git commit -m "${package} ${version}"
              git push origin master
            fi
            cd "$GITHUB_WORKSPACE"
          done
