name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build all modules and run tests
        run: ./build.sh test

      - name: Verify the GUI is removable
        run: |
          cp -r . /tmp/nogui
          cd /tmp/nogui
          rm -rf gui run-gui.sh build dist
          ./build.sh
          test -f dist/connectk-core.jar
          test -f dist/connectk-cli.jar
          test ! -f dist/connectk-gui.jar
